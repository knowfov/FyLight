<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline';" />
<title>fyLight</title>
<style>
  :root {
    --accent: #5e63ff;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #0a0c10;
    font-family: "Segoe UI", "SF Pro Text", ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  /* Окно НЕ прозрачное (см. main.js) - фон залит тем же цветом, что и у
     обычного окна приложения, поэтому рост окна во время анимации не
     показывает рабочий стол по краям и не даёт вспышки при подмене на
     index.html. Карточка при этом имеет ФИКСИРОВАННЫЙ размер и просто
     остаётся в центре, пока вокруг неё "прибывает" область окна. */
  .stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .card {
    position: relative;
    width: 320px;
    height: 380px;
    flex: none;
    border-radius: 26px;
    background:
      radial-gradient(120% 90% at 50% 15%, rgba(94, 99, 255, 0.10), transparent 60%),
      linear-gradient(180deg, #1b1c22 0%, #17181d 100%);
    border: 1px solid rgba(255, 255, 255, 0.06);
    /* Внешний box-shadow больше не используем - окно теперь совпадает по
       размеру с самой карточкой (main.js), поэтому тень наружу всё равно
       обрезалась бы границей окна. Вместо неё - лёгкое внутреннее свечение. */
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 26px;
    animation: card-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
    transition: opacity 0.25s ease;
  }

  @keyframes card-in {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  /* Угасание карточки запускается ровно в момент старта роста окна (шаг
     'expand' из main.js) и длится столько же, сколько сама анимация роста
     bounds - длительность подставляется через CSS-переменную --expand-ms
     из JS, чтобы оба процесса были гарантированно синхронны. */
  .card.is-expanding {
    opacity: 0;
    transition: opacity var(--expand-ms, 900ms) ease;
  }

  .close-btn {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: none;
    background: rgba(255, 255, 255, 0.06);
    color: rgba(255, 255, 255, 0.45);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease, color 0.15s ease;
  }

  .close-btn:hover {
    background: #e2554a;
    color: #fff;
  }

  .loader-mark {
    width: 110px;
    height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .loader-mark svg {
    width: 84px;
    height: 84px;
    overflow: visible;
  }

  .loader-mark path {
    fill: #ffffff;
    fill-opacity: 0;
    stroke: #ffffff;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 300;
    stroke-dashoffset: 300;
    animation: bolt-cycle 2.4s cubic-bezier(0.65, 0, 0.35, 1) infinite;
  }

  @keyframes bolt-cycle {
    0% {
      stroke-dashoffset: 300;
      fill-opacity: 0;
      filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0));
    }
    38% {
      stroke-dashoffset: 0;
      fill-opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255, 255, 255, 0.35));
    }
    55% {
      fill-opacity: 1;
      filter: drop-shadow(0 0 22px rgba(255, 255, 255, 0.9));
    }
    75% {
      fill-opacity: 1;
      filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.4));
    }
    100% {
      stroke-dashoffset: -300;
      fill-opacity: 0;
      filter: drop-shadow(0 0 0 rgba(255, 255, 255, 0));
    }
  }

  .wordmark {
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: #ffffff;
    margin-top: -8px;
  }

  /* ---------- Молния внизу карточки: указывает на текущий шаг ---------- */
  .steps {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 30px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 0 28px;
  }

  .status-text {
    font-size: 13px;
    color: rgba(255, 255, 255, 0.55);
    text-align: center;
    min-height: 16px;
    transition: opacity 0.2s ease;
  }

  .bolt-track {
    position: relative;
    width: 220px;
    height: 3px;
    border-radius: 3px;
    background: rgba(255, 255, 255, 0.08);
    overflow: hidden;
  }

  .bolt-track__fill {
    position: absolute;
    inset: 0;
    width: 34%;
    border-radius: 3px;
    background: linear-gradient(90deg, transparent, #ffffff, transparent);
    box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    animation: bolt-sweep 1.6s ease-in-out infinite;
  }

  @keyframes bolt-sweep {
    0%   { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="card" id="card">
      <button class="close-btn" id="btn-close" title="Закрыть">✕</button>

      <div class="loader-mark">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M58 4 L18 54 L42 54 L34 96 L82 40 L56 40 Z" />
        </svg>
      </div>
      <div class="wordmark">fyLight</div>

      <div class="steps">
        <div class="bolt-track"><div class="bolt-track__fill"></div></div>
        <div class="status-text" id="status-text">Подготовка для вас…</div>
      </div>
    </div>
  </div>

  <script>
    const cardEl = document.getElementById('card');
    const statusEl = document.getElementById('status-text');

    document.getElementById('btn-close')?.addEventListener('click', () => {
      window.windowControls?.close();
    });

    window.installerAPI?.onStatus((payload) => {
      if (!payload) return;
      if (payload.text) {
        statusEl.style.opacity = '0';
        setTimeout(() => {
          statusEl.textContent = payload.text;
          statusEl.style.opacity = '1';
        }, 120);
      }
      // 'expand' приходит из main.js РОВНО в момент, когда начинается рост
      // окна (durationMs совпадает с длительностью анимации bounds там же),
      // поэтому карточка тает плавно и синхронно вместе с ростом окна, а не
      // рывком в конце.
      if (payload.step === 'expand') {
        cardEl.style.setProperty('--expand-ms', `${payload.durationMs || 900}ms`);
        // rAF, чтобы браузер успел применить transition-duration до того,
        // как класс сменит opacity - иначе переход может "проскочить" без анимации.
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            cardEl.classList.add('is-expanding');
          });
        });
      }
    });
  </script>
</body>
</html>
